name: Build IG Save APK
# v3 Material 3 Expressive release build

on:
  push:
    branches: [ build/ig-media-saver-20260919 ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release APK
        working-directory: igsave
        run: gradle --no-daemon assembleRelease
      - name: Stage APK
        run: |
          mkdir -p dist
          cp igsave/app/build/outputs/apk/release/app-release-unsigned.apk dist/IGSave-v3-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IGSave-v3-unsigned
          path: dist/IGSave-v3-unsigned.apk
          if-no-files-found: error
